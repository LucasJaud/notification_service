
spring:
    datasource:
        url: jdbc:postgresql://localhost:5433/notification_service
        username: lucas
        password: postgres
        driver-class-name: org.postgresql.Driver
        hikari:
            idle-timeout: 600000
            connection-timeout: 30000
            max-lifetime: 1800000
            maximum-pool-size: 20
    
    jpa:
        show-sql: true
        # properties:    
        #     '[hibernate.generate_statistics]': true
        #     '[hibernate.format_sql]': true
    rabbitmq:
      host: localhost
      port: 5672
      username: admin
      password: admin
      queue-name: msg-http-queue
      exchange: msg-http-queue-ex
      listener:
        direct:
          acknowledge-mode: manual
          prefetch: 10
      template:
        routing-key: msg-http
        # routing-key: ${RABBITMQ_ROUTING_KEY}

logging:
  level:
    org:
      hibernate:
        stat: DEBUG
        sql: DEBUG
        orm:
          jdbc:
            bind: DEBUG  
